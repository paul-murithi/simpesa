services:
  db:
    image: postgres:16
    container_name: simpesa-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simpesa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simpesa}
      POSTGRES_DB: ${POSTGRES_DB:-simpesa}
    volumes:
      - simpesa_db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: simpesa-redis
    volumes:
      - simpesa_redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: simpesa-api
    ports:
      - "${API_HOST_PORT:-33000}:${API_PORT:-3000}"
    environment:
      PORT: ${API_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://simpesa:simpesa@db:5432/simpesa}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:35173,http://127.0.0.1:35173}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: simpesa-worker
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://simpesa:simpesa@db:5432/simpesa}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      PROCESSING_VISIBILITY_DELAY_MS: ${PROCESSING_VISIBILITY_DELAY_MS:-5000}
      PIN_TIMEOUT_MS: ${PIN_TIMEOUT_MS:-60000}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    container_name: simpesa-ui
    ports:
      - "${UI_HOST_PORT:-35173}:80"
    depends_on:
      api: { condition: service_started }

volumes:
  simpesa_db_data:
  simpesa_redis_data:
