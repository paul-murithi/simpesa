name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: simpesa_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm install
      - name: Setup Test DB
        run: |
          npm run db:migrate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/simpesa_test
          TEST_DATABASE_URL: postgresql://user:password@localhost:5432/simpesa_test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://user:password@localhost:5432/simpesa_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  docs-build:
    name: Verify Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: simpesa-docs/package.json
      - name: Install Docs Dependencies
        working-directory: simpesa-docs
        run: npm install
      - name: Build Docs
        working-directory: simpesa-docs
        run: npm run build
