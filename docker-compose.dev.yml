services:
  db:
    image: postgres:16-alpine
    container_name: simpesa-db-dev
    restart: always
    env_file:
      - .env.host
    ports:
      - "5432:5432"
    volumes:
      - simpesa_db_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: simpesa-redis-dev
    restart: always
    ports:
      - "6379:6379"

volumes:
  simpesa_db_dev_data:
